    <div id="k-bar"></div>
  </div>
  <script>
    // local times: the host starts this beat on the spoken word
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#k-plate", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.22, ease: "power3.in" }, 0);
    tl.fromTo("#k-w1", { opacity: 0, scale: 1.45, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.18);
