<html>
<template>
  <style>
    #root { position: absolute; inset: 0; font-family: Inter, sans-serif; color: #14213D; }
    #mt-title { position: absolute; left: 360px; top: 190px; font-family: Outfit, sans-serif; font-weight: 800; font-size: 88px; line-height: 1; letter-spacing: -0.02em; }
    #mt-sub { position: absolute; left: 360px; top: 290px; font-size: 36px; }
    #mt-city { position: absolute; left: 330px; top: 370px; width: 720px; height: 446px; }
    #mt-scale { position: absolute; left: 0; top: 0; width: 1000px; height: 620px; transform: scale(0.72); transform-origin: 0 0; }
    #mt-scale svg { position: absolute; inset: 0; overflow: visible; }
    .bld { transform-box: fill-box; transform-origin: 50% 100%; }
    .bcam { transform-box: fill-box; transform-origin: 50% 50%; }
    .blabel { font: 700 40px Inter, sans-serif; fill: #14213D; }
  </style>
  <div id="root" data-composition-id="metro" data-width="1080" data-height="1920">
    <div id="mt-title">Every year</div>
    <div id="mt-sub">New buildings across the metro</div>
    <div id="mt-city"><div id="mt-scale">
      <svg viewBox="0 0 1000 620">
        <rect x="0" y="560" width="1000" height="8" fill="#14213D"/>
        <g id="mt-blds"></g>
      </svg>
    </div></div>
  </div>
  <script>
    // timing anchors, seconds from this scene's start
    const T = { rise: 0.42, fitted: 4.5, end: 6.74 };
    // seven new buildings of different kinds, each labelled
    const B = [ [20,110,300,"Clinic"], [150,120,420,"Offices"], [290,110,240,"School"], [420,150,360,"Depot"],
                [590,110,470,"Flats"], [720,120,280,"Retail"], [860,120,380,"Hotel"] ];
    const g = document.querySelector("#mt-blds");
    let svg = "";
    B.forEach(([x, w, h, name], i) => {
      const y = 560 - h;
      let win = "";
      for (let r = y + 30; r < 540 - 20; r += 46) for (let c = x + 18; c < x + w - 30; c += 34) win += `<rect x="${c}" y="${r}" width="18" height="24" fill="#14213D" opacity=".18"/>`;
      svg += `<g class="bld" id="mt-b${i}"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#FFFFFF" stroke="#14213D" stroke-width="5"/>${win}</g>` +
             `<g class="bcam" id="mt-c${i}"><rect x="${x + w - 64}" y="${y - 40}" width="64" height="30" rx="7" fill="#14213D"/><circle cx="${x + w - 64}" cy="${y - 25}" r="12" fill="#14213D"/><circle cx="${x + w - 64}" cy="${y - 25}" r="5" fill="#F2F1EC"/><rect x="${x + w - 36}" y="${y - 12}" width="8" height="12" fill="#14213D"/></g>` +
             "";
    });
    g.innerHTML = svg;
    const tl = gsap.timeline({ paused: true });
    // whip in from the right
    tl.fromTo(["#mt-title", "#mt-sub", "#mt-city"], { x: 1250, filter: "blur(14px)" }, { x: 0, filter: "blur(0px)", duration: 0.34, stagger: 0.04, ease: "power3.out" }, 0);
    tl.to(["#mt-title", "#mt-sub", "#mt-city"], { x: -1250, filter: "blur(14px)", duration: 0.32, ease: "power3.in" }, T.end - 0.32);
    // "New buildings go up across the metro": they rise one after another
    tl.fromTo(".bld", { scaleY: 0 }, { scaleY: 1, duration: 0.8, stagger: 0.36, ease: "expo.out" }, T.rise);
    // "each one needs security systems fitted": a camera lands on every roof
    tl.fromTo(".bcam", { scale: 0 }, { scale: 1, duration: 0.3, stagger: 0.18, ease: "back.out(1.8)" }, T.fitted);
    window.__timelines["metro"] = tl;
  </script>
</template>
</html>
