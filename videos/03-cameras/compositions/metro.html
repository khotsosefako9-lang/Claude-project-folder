<html>
<template>
  <style>
    #root { position: absolute; inset: 0; font-family: Inter, sans-serif; color: #14213D; }
    #mt-title { position: absolute; left: 90px; top: 240px; font-family: Outfit, sans-serif; font-weight: 800; font-size: 96px;
      line-height: 1; letter-spacing: -0.02em; }
    #mt-sub { position: absolute; left: 90px; top: 350px; font-size: 40px; }
    #mt-city { position: absolute; left: 40px; top: 470px; width: 1000px; height: 620px; }
    #mt-city svg { position: absolute; inset: 0; overflow: visible; }
    .bld { transform-box: fill-box; transform-origin: 50% 100%; }
    .bcam { transform-box: fill-box; transform-origin: 50% 50%; }
    .blabel { font: 700 28px Inter, sans-serif; fill: #14213D; }
  </style>
  <div id="root" data-composition-id="metro" data-width="1080" data-height="1920">
    <div id="mt-title">Every year</div>
    <div id="mt-sub">New buildings across the metro</div>
    <div id="mt-city">
      <svg viewBox="0 0 1000 620">
        <rect x="0" y="560" width="1000" height="8" fill="#14213D"/>
        <g id="mt-blds"></g>
      </svg>
    </div>
  </div>
  <script>
    // timing anchors, seconds from this scene's start
    const T = { rise: 0.5, fitted: 3.6 };
    // seven new buildings of different kinds, each labelled
    const B = [ [20,110,300,"Clinic"], [150,120,420,"Offices"], [290,110,240,"School"], [420,150,360,"Warehouse"],
                [590,110,470,"Flats"], [720,120,280,"Retail"], [860,120,380,"Hotel"] ];
    const g = document.querySelector("#mt-blds");
    let svg = "";
    B.forEach(([x, w, h, name], i) => {
      const y = 560 - h;
      let win = "";
      for (let r = y + 30; r < 540 - 20; r += 46) for (let c = x + 18; c < x + w - 30; c += 34) win += `<rect x="${c}" y="${r}" width="18" height="24" fill="#14213D" opacity=".18"/>`;
      svg += `<g class="bld" id="mt-b${i}"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#FFFFFF" stroke="#14213D" stroke-width="5"/>${win}</g>` +
             `<g class="bcam" id="mt-c${i}"><rect x="${x + w - 30}" y="${y - 24}" width="40" height="20" rx="3" fill="#14213D"/><rect x="${x + w - 14}" y="${y - 6}" width="6" height="8" fill="#14213D"/></g>` +
             `<text class="blabel" x="${x + w / 2}" y="600" text-anchor="middle">${name}</text>`;
    });
    g.innerHTML = svg;
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(["#mt-title", "#mt-sub"], { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.12, ease: "power4.out" }, 0.05);
    // "New buildings go up across the metro": they rise one after another
    tl.fromTo(".bld", { scaleY: 0 }, { scaleY: 1, duration: 0.55, stagger: 0.22, ease: "expo.out" }, T.rise);
    tl.fromTo(".blabel", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.22, ease: "power2.out" }, T.rise + 0.3);
    // "each one needs security systems fitted": a camera lands on every roof
    tl.fromTo(".bcam", { scale: 0 }, { scale: 1, duration: 0.22, stagger: 0.12, ease: "back.out(1.8)" }, T.fitted);
    window.__timelines["metro"] = tl;
  </script>
</template>
</html>
